plugins:
  authzen:
    path: "authzen"
    decision: "allow"
    # Optional: enable AuthZEN Search APIs (spec Section 8). Each field names
    # a Rego rule, in the package given by `path`, that returns the set of
    # permitted entities for a partial input. Omit a field to disable the
    # corresponding endpoint (which then responds with 501).
    search:
      subject: "subject_search"
      resource: "resource_search"
      action: "action_search"
      # max_limit: 1000  # per-page cap; defaults to 1000 when unset
    # Optional: PDP capability URNs advertised in the `capabilities` field of
    # the PDP metadata document (spec Section 9.1.2). The core spec registers no
    # URNs of its own, so these are operator-supplied and must start with "urn:".
    # capabilities:
    #   - "urn:openid:authzen:capability:access-request"
    # Optional: opt into the AuthZEN Profile for Obligations (Draft 1). The listed
    # Obligation Types are advertised as `supported_obligations` in the PDP
    # metadata, and a PEP's own `context.supported_obligations` is filtered down
    # to this set before the policy sees it. Pair with `decision_context` to
    # actually emit obligations in the Decision context.
    # supported_obligations:
    #   - "step-up"
    #   - "notification"
    # Optional: advertise the Access Request and Approval Profile (Draft 1) discovery
    # members in the PDP metadata. Both must be https:// URIs. This plugin does
    # not host the Access Request Service — the profile allows a separate
    # service to — so these point at wherever it actually runs. Pair with
    # `decision_context` to emit `context.access_request` on a requestable
    # denial, and list the capability URN above.
    # access_request_endpoint: "https://requests.example.com/access/v1/requests"
    # jwks_uri: "https://requests.example.com/access/v1/jwks"
    # Optional: a JWT asserting the PDP metadata, published as `signed_metadata`
    # (spec Section 9.1.3). Sign it outside the plugin; it must carry `iss`, and
    # any claim that mirrors a setting above must match that setting.
    # signed_metadata: "<header>.<claims>.<signature>"
    # Optional: pin the PDP identifier (spec Section 9.1.1) that every endpoint
    # in the metadata is built from. Unset derives it from the request's
    # X-Forwarded-Proto/X-Forwarded-Host (first value) or Host. Required by the
    # access_request signing and approval settings below.
    # base_url: "https://pdp.example.com"
    # Optional: the PDP's part of the Access Request and Approval Profile.
    # Requestable denials returned by `decision_context` are completed with
    # `expires_at`, `evaluation_id` and, with a signing key, a signed
    # `binding_token`; a PEP's `context.approval` is verified against the
    # trusted issuers before the policy sees it. Keys are served at
    # /access/v1/jwks and advertised as `jwks_uri` unless one is set above.
    # access_request:
    #   signing_key_file: /etc/authzen/pdp-signing.jwk
    #   audience: "https://requests.example.com"
    #   denial_ttl: 10m
    #   binding_context_members: ["project"]
    #   approval_issuers:
    #     - issuer: "https://requests.example.com"
    #       jwks_file: /etc/authzen/ars-jwks.json
    #   # Host the Access Request Service in the plugin (README: "Hosted
    #   # Access Request Service"). Needs base_url, signing_key_file, a
    #   # Postgres DSN in AUTHZEN_ARS_DSN, token issuers and three rules.
    #   service:
    #     enabled: true
    #     caller_auth:
    #       issuers: [{issuer: "https://idp.example.com", audience: "https://pdp.example.com", jwks_uri: "https://idp.example.com/.well-known/jwks.json"}]
    #     approver_auth:
    #       issuers: [{issuer: "https://idp.example.com", audience: "authzen-approver-api", jwks_uri: "https://idp.example.com/.well-known/jwks.json"}]
    #     rules: {caller: ars_caller, workflow: ars_workflow, approver: ars_approver}
